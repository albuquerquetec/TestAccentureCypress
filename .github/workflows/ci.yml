name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: API e interface
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Executar a suíte
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          install-command: npm ci

      - name: Publicar o relatório
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cypress
          path: |
            cypress/screenshots
            cypress/videos
          retention-days: 7
          if-no-files-found: ignore
